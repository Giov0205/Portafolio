<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22303f"/>
      <stop offset="0.45" stop-color="#101822"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#8c1420" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#4a0a12" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4a0a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#e11d2e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e11d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d2e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e11d2e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g filter="url(#soft)" opacity="0.9">
    <circle cx="260" cy="170" r="300" fill="#7a101c" opacity="0.55"/>
    <circle cx="1280" cy="760" r="260" fill="#e11d2e" opacity="0.16"/>
    <path d="M-100 780 L900 -80" stroke="url(#beam)" stroke-width="90" opacity="0.35"/>
  </g>

  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- Radar / retícula decorativa -->
  <g fill="none" stroke="#e11d2e" stroke-opacity="0.18">
    <circle cx="1120" cy="300" r="120" stroke-width="1.5"/>
    <circle cx="1120" cy="300" r="220" stroke-dasharray="6 10"/>
    <circle cx="1120" cy="300" r="320" stroke-dasharray="2 14"/>
    <path d="M1120 40v520M860 300h520"/>
  </g>

  <!-- Silueta de terreno abstracta -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5">
    <path d="M-50 620 L160 560 L300 600 L420 520 L560 585 L700 520 L860 610 L1010 545 L1180 620 L1330 560 L1500 630 L1650 590"/>
    <path d="M-50 700 L180 650 L340 690 L480 620 L640 690 L790 630 L950 700 L1110 640 L1270 705 L1440 650 L1650 700"/>
    <path d="M-50 780 L200 740 L380 775 L560 715 L720 780 L900 720 L1070 785 L1250 730 L1420 790 L1650 745"/>
  </g>

  <!-- Puntos de control -->
  <g fill="#e11d2e" fill-opacity="0.55">
    <circle cx="160" cy="560" r="4"/>
    <circle cx="700" cy="520" r="4"/>
    <circle cx="1180" cy="620" r="4"/>
    <circle cx="1330" cy="560" r="4"/>
  </g>

  <!-- Marcas de esquina -->
  <g fill="none" stroke="#e11d2e" stroke-opacity="0.55" stroke-width="3">
    <path d="M60 110V60h50"/>
    <path d="M1490 60h50v50"/>
    <path d="M1540 790v50h-50"/>
    <path d="M110 840H60v-50"/>
  </g>
</svg>
