<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b23"/>
      <stop offset="1" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a515d"/>
      <stop offset="1" stop-color="#1b1f26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="720" fill="url(#grid)"/>
  <rect width="600" height="720" fill="url(#glow)"/>

  <!-- Silueta de retrato -->
  <g fill="url(#sil)">
    <circle cx="300" cy="268" r="96"/>
    <path d="M300 380c-104 0-172 62-186 170l-10 170h392l-10-170c-14-108-82-170-186-170Z"/>
  </g>

  <!-- Retícula sobre el rostro -->
  <g stroke="#22d3ee" stroke-opacity="0.3" fill="none">
    <circle cx="300" cy="268" r="120" stroke-dasharray="4 10"/>
    <path d="M110 268h380M300 80v380"/>
  </g>

  <!-- Marco y esquinas -->
  <rect x="16" y="16" width="568" height="688" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="none" stroke="#22d3ee" stroke-width="4">
    <path d="M16 70V16h54"/>
    <path d="M530 16h54v54"/>
    <path d="M584 650v54h-54"/>
    <path d="M70 704H16v-54"/>
  </g>

  <g font-family="Consolas, monospace" fill="#98a1b0">
    <text x="40" y="52" font-size="14" letter-spacing="4">ARCHIVO//PERFIL</text>
    <text x="560" y="680" font-size="14" letter-spacing="4" text-anchor="end">600×720</text>
  </g>
  <text x="300" y="640" font-family="Teko, Rajdhani, sans-serif" font-size="46" fill="#ffffff" fill-opacity="0.18" text-anchor="middle" letter-spacing="6">TU FOTO AQUÍ</text>
</svg>
