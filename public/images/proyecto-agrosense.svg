<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a24"/><stop offset="1" stop-color="#05090e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Mapa de parcelas -->
  <g transform="translate(60 70)">
    <rect width="330" height="310" fill="#0a131c" stroke="#ffffff" stroke-opacity="0.14"/>
    <path d="M0 120 C80 100 140 160 220 130 S330 90 330 90" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
    <polygon points="40,40 140,30 150,110 50,120" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="2"/>
    <polygon points="180,50 290,60 280,150 175,140" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-width="2"/>
    <polygon points="60,180 170,170 185,270 70,280" fill="#22d3ee" fill-opacity="0.1" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="95" cy="75" r="6" fill="#22d3ee"/>
    <circle cx="230" cy="100" r="6" fill="#4ade80"/>
    <circle cx="120" cy="225" r="6" fill="#67e8f9"/>
    <text x="14" y="296" font-family="Consolas, monospace" font-size="12" fill="#98a1b0" letter-spacing="3">PARCELAS · MAPA</text>
  </g>

  <!-- Tarjetas de clima -->
  <g font-family="Consolas, monospace">
    <rect x="420" y="70" width="150" height="80" fill="#0a131c" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="436" y="96" font-size="11" fill="#98a1b0" letter-spacing="2">TEMPERATURA</text>
    <text x="436" y="132" font-size="28" fill="#ffffff">28°C</text>
    <rect x="590" y="70" width="150" height="80" fill="#0a131c" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="606" y="96" font-size="11" fill="#98a1b0" letter-spacing="2">HUMEDAD</text>
    <text x="606" y="132" font-size="28" fill="#67e8f9">64%</text>
  </g>

  <!-- Gráfica -->
  <g transform="translate(420 170)">
    <rect width="320" height="210" fill="#0a131c" stroke="#ffffff" stroke-opacity="0.14"/>
    <path d="M20 160 L70 130 L120 140 L170 95 L220 105 L270 60 L300 70 L300 190 L20 190 Z" fill="url(#area)"/>
    <polyline points="20,160 70,130 120,140 170,95 220,105 270,60 300,70" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <text x="16" y="28" font-family="Consolas, monospace" font-size="11" fill="#98a1b0" letter-spacing="2">HISTORIAL DE CLIMA</text>
  </g>

  <text x="740" y="44" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#67e8f9" letter-spacing="3">REACT · EXPRESS · POSTGRES</text>
</svg>
